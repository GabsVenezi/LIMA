<html lang="pt-BR">

    <title>Página Teste</title>

    <style>
        H1{
            color:rgb(0, 0, 0);

            text-align: center;
            background-color:rgb(21, 243, 132);

            margin-left: 25%;
            margin-right: 25%;
        }
        H2{
            color: rgb(255, 255, 255);
            text-align: center;
            font-size: 36px;
        }
        body{
            background-color: rgb(0, 0, 0);
        }
        h1:hover, h2:hover, p:hover {
            color: rgb(21, 243, 132);
            font-size: 42px;
        }
</style>
</head>
<body>

<h1>Gabriel Venezi Xavier da Silva</h1>

</html>

<!-- SEÇÕES IMPORTANTES :

O <html>: Dentro da tag <html> temos as tags <head> que é a cabeça da página; <Title> que é o título da página; <H1> que é o título (e caso queira
adicionar mais, só adicionar o numeral seguinte como "H2"); <p> que sinaliza um parágrafo; <footer> que é o
rodapé da página e o <body> que basicamente onde todas essas informações vão estar, no "corpo" da página.

Style : A partir da seção style eu estilizei cada parte do código HTML, através do CSS. E com isso, é só
aplicar os comandos CSS como "color"  para a coloração; "font-weight" para o tipo de fonte; 
"text-decoration" para as decorações no texto, como o "underline"; "hover" para interativo com o mouse.
